[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TobiasStark/campfire"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# Echtzeit-Audio auch im Debug-Build optimiert: Unoptimiert schafft die Rauschunterdrueckung
# ihre 20-ms-Frames kaum, und der Audio-Thread sendet dann stossweise (hoerbar als Ruckeln).
[profile.dev.package.nnnoiseless]
opt-level = 3

[profile.dev.package.opusic-sys]
opt-level = 3
