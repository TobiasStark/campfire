[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "tools/*"]

[workspace.package]
version = "0.0.0" # set from the git tag by the release workflow
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TobiasStark/campfire"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# Real-time audio is optimized even in debug builds: unoptimized, noise suppression barely keeps up
# with its 20 ms frames and the audio thread sends in bursts (audible as stuttering).
[profile.dev.package.nnnoiseless]
opt-level = 3

[profile.dev.package.opusic-sys]
opt-level = 3
