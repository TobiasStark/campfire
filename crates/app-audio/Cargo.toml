[package]
name = "app-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
app-net = { path = "../app-net" }
app-proto = { path = "../app-proto" }
bytes = "1.12.1"
cpal = "0.18"
iroh = "1.4.1"
opus = "0.4"
rand = "0.10.3"
ringbuf = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
nnnoiseless = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
app-testkit = { path = "../app-testkit" }
