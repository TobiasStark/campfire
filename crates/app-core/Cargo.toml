[package]
name = "app-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
blake3 = "1"
age = "0.12.1"
app-net = { path = "../app-net" }
app-proto = { path = "../app-proto" }
bytes = "1.12.1"
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "zeroize"] }
getrandom = "0.4.3"
iroh = "1.4.1"
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
zeroize = "1.9.1"

[dev-dependencies]
app-testkit = { path = "../app-testkit" }
tempfile = "3.27.0"
