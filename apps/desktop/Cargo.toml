[package]
name = "app-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
app-audio = { path = "../../crates/app-audio" }
app-video = { path = "../../crates/app-video", features = ["capture"] }
app-hotkeys = { path = "../../crates/app-hotkeys" }
app-blobs = { path = "../../crates/app-blobs" }
app-core = { path = "../../crates/app-core" }
app-net = { path = "../../crates/app-net" }
app-proto = { path = "../../crates/app-proto" }
bytes = "1.12.1"
rfd = { version = "0.18", default-features = false }
data-encoding = "2.11.1"
ffmpeg-next = { version = "9", optional = true }
iced = { version = "0.14", features = ["wgpu", "advanced", "tokio", "image"] }
iroh = "1.4.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tray-icon = "0.26"
getrandom = "0.4"
zeroize = "1.9.1"
serde = "1"
serde_json = "1.0.154"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_Debug", "Win32_UI_Shell", "Win32_System_Time", "Foundation", "Data_Xml_Dom", "UI_Notifications"] }
velopack = "=1.3.39-g8d2844f"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

[[bin]]
name = "campfire"
path = "src/main.rs"

[features]
# ffmpeg-Encoder fuer Streams (braucht FFMPEG_DIR/LIBCLANG_PATH, siehe docs/building.md)
video = ["app-video/ffmpeg"]
# Spike M0-06: braucht FFMPEG_DIR / LIBCLANG_PATH (siehe docs/building.md)
ffmpeg = ["dep:ffmpeg-next"]

[[example]]
name = "video_player"
required-features = ["ffmpeg"]
