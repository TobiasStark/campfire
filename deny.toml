# cargo deny check advisories bans sources (CI, N-13)
[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates fail only when we depend on them directly; deeper ones we cannot swap.
unmaintained = "workspace"
# Every entry needs a reason; revisit them when dependencies are updated.
ignore = [
    # SQLite < 3.54: stale page-cache bytes when a crafted DB + -wal pair is opened. We only open
    # our own database in the user's profile (a local attacker could change it anyway). Fix needs
    # rusqlite 0.41 (libsqlite3-sys 0.39); rusqlite_migration has no release for it yet (2026-11).
    { id = "RUSTSEC-2026-0459", reason = "local only; waiting for rusqlite_migration with rusqlite 0.41" },
    # crypto-bigint 0.5 timing: reached via age -> p256 (hpke recipients). We encrypt backups
    # with scrypt passphrases only; P-256 is never used.
    { id = "RUSTSEC-2026-0387", reason = "P-256 code path in age is not used" },
    # zip 8 extraction issues (symlinks, Unix permissions, abort on large symlink): reached only
    # via velopack applying update packages from our own release feed (Windows, no symlinks).
    # Fix needs velopack 1.3 (and vpk 1.3 in the release workflow).
    { id = "RUSTSEC-2026-0367", reason = "velopack update extraction, Unix-only issue" },
    { id = "RUSTSEC-2026-0368", reason = "velopack update extraction from our own feed" },
    { id = "RUSTSEC-2026-0369", reason = "velopack update extraction, Unix permissions" },
    { id = "RUSTSEC-2026-0429", reason = "velopack update extraction from our own feed" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates are not published; their path dependencies are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
