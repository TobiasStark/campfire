name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  # ffmpeg (LGPL, shared libraries) for streaming and video previews; pinned.
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-06-12-50/ffmpeg-n9.0.2-47-gb204e94e90-win64-lgpl-shared-9.0.zip
  FFMPEG_SHA256: 8e83cbb02c058677319058cdbd05dfb1871bf263af4f9e8fb104199378fe78ee

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Streaming and video previews need ffmpeg: separate job so they don't break unnoticed.
  video:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: 1.94.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: ffmpeg laden
        shell: pwsh
        run: |
          # Fixed build with checksum (never "latest"): it reaches everyone via auto-update.
          # New build: pick tag/file from https://github.com/BtbN/FFmpeg-Builds/releases and
          # SHA-256 (shown on the asset as "digest") in FFMPEG_URL/FFMPEG_SHA256.
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { Write-Error "ffmpeg checksum mismatch: $hash"; exit 1 }
          Expand-Archive ffmpeg.zip -DestinationPath C:/ffmpeg
          $dir = (Get-ChildItem C:/ffmpeg -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$dir/bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Header paths for bindgen
        shell: bash
        run: |
          ARGS=""
          IFS=';' read -ra P <<< "$INCLUDE"
          for d in "${P[@]}"; do [ -n "$d" ] && ARGS="$ARGS -I\"$d\""; done
          echo "BINDGEN_EXTRA_CLANG_ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets --features app-desktop/video,app-video/ffmpeg -- -D warnings
      - run: cargo test -p app-video -p app-desktop --features app-desktop/video,app-video/ffmpeg
