name: Release
# Push tag v1.2.3 -> installer + update packages are built and published as a GitHub release.
# Tags with a hyphen (v1.2.3-beta.1) go to the "beta" channel, all others to "stable".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # ffmpeg (LGPL, shared libraries) for streaming and video previews; pinned.
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-06-12-50/ffmpeg-n9.0.2-47-gb204e94e90-win64-lgpl-shared-9.0.zip
  FFMPEG_SHA256: 8e83cbb02c058677319058cdbd05dfb1871bf263af4f9e8fb104199378fe78ee
  # Velopack CLI, same version as the velopack crate (apps/desktop/Cargo.toml); the SHA-256
  # matches the SHA-512 that nuget.org publishes for this package.
  VPK_VERSION: 1.3.39-g8d2844f
  VPK_SHA256: 1a7e031f285768b6418cae43baf98d3bc295510c140a7dc5757bf99af9b78ecf

jobs:
  # A tag on a red commit must not be shipped to everyone: test first.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Known vulnerabilities, yanked crates, foreign sources (N-13). Runs in a container.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources

  release:
    needs: [test, deny]
    runs-on: windows-latest
    # Protect this environment with required reviewers in the repository settings: then no
    # release goes out without a second look (N-13).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: 1.94.0
      # No build cache here: caches from other runs must not flow into the release (N-13).
      - name: Take version from tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          if [[ "$V" == *-* ]]; then echo "CHANNEL=beta" >> "$GITHUB_ENV"; else echo "CHANNEL=stable" >> "$GITHUB_ENV"; fi
          sed -i "s/^version = \"0.0.0\"/version = \"$V\"/" Cargo.toml
      - name: Download ffmpeg
        shell: pwsh
        run: |
          # Fixed build with checksum (never "latest"): it ships to everyone in the installer.
          # New build: pick tag/file from https://github.com/BtbN/FFmpeg-Builds/releases and
          # SHA-256 (shown on the asset as "digest") in FFMPEG_URL/FFMPEG_SHA256.
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg.zip
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { Write-Error "ffmpeg checksum mismatch: $hash"; exit 1 }
          Expand-Archive ffmpeg.zip -DestinationPath C:/ffmpeg
          $dir = (Get-ChildItem C:/ffmpeg -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-ChildItem "$dir/bin" | Select-Object Name, Length
      # bindgen (libclang) only finds the MSVC headers with the developer environment.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Header paths for bindgen
        shell: bash
        run: |
          ARGS=""
          IFS=';' read -ra P <<< "$INCLUDE"
          for d in "${P[@]}"; do [ -n "$d" ] && ARGS="$ARGS -I\"$d\""; done
          echo "BINDGEN_EXTRA_CLANG_ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
      - run: cargo build --release -p app-desktop --bin campfire --features video
      - name: Build Velopack package
        shell: bash
        run: |
          # Install vpk only from the checked package, not from a feed (N-13).
          mkdir vpk-src
          curl -sSfL -o "vpk-src/vpk.$VPK_VERSION.nupkg" "https://api.nuget.org/v3-flatcontainer/vpk/$VPK_VERSION/vpk.$VPK_VERSION.nupkg"
          echo "$VPK_SHA256  vpk-src/vpk.$VPK_VERSION.nupkg" | sha256sum -c -
          printf '<configuration><packageSources><clear /><add key="local" value="vpk-src" /></packageSources></configuration>' > vpk-nuget.config
          dotnet tool install -g vpk --version "$VPK_VERSION" --configfile vpk-nuget.config
          mkdir pack
          cp target/release/campfire.exe pack/
          cp target/release/*.dll pack/ 2>/dev/null || true
          cp "$FFMPEG_DIR"/bin/*.dll pack/
          # LGPL: license text and notices (source, source code) belong in the installer.
          if ls "$FFMPEG_DIR"/LICENSE* >/dev/null 2>&1; then
            for l in "$FFMPEG_DIR"/LICENSE*; do cp "$l" "pack/ffmpeg-$(basename "$l")"; done
          else
            echo "::warning::No license text found in the ffmpeg build"
          fi
          cp packaging/THIRD-PARTY-NOTICES.txt pack/
          echo "ffmpeg-Build: $FFMPEG_URL (SHA-256 $FFMPEG_SHA256)" >> pack/THIRD-PARTY-NOTICES.txt
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel "$CHANNEL" --token "${{ secrets.GITHUB_TOKEN }}" || true
          vpk pack --packId Campfire --packVersion "$VERSION" --packDir pack --mainExe campfire.exe --channel "$CHANNEL" --outputDir out
          ls -l out
          SIZE=$(stat -c %s out/*Setup.exe)
          echo "Installer: $SIZE Bytes"
          test "$SIZE" -le 125829120
      # Verifiable build provenance: gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Publish release
        shell: bash
        run: |
          PRE=""; [[ "$CHANNEL" == beta ]] && PRE="--prerelease"
          # Release notes: the matching section of CHANGELOG.md, falling back to generated notes.
          awk -v v="$VERSION" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then NOTES="--notes-file notes.md"; else NOTES="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" out/* --title "Campfire $VERSION" $NOTES $PRE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
