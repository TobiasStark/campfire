name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem first, the solution can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How could Campfire handle this? Keep in mind that there is no central server.
